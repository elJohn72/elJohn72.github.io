<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoGrow - Torre Hidropónica</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>🌱 EcoGrow - Torre Hidropónica</h1>
    <p>Monitoreo visual de tu sistema inteligente</p>
  </header>

  <section class="gallery">
    <img src="assets/img/img1.jpeg" alt="Torre con plantas" />
    <img src="assets/img/img2.jpeg" alt="Estructura sin plantas" />
    <img src="assets/img/img3.jpeg" alt="Torre con lechugas" />
  </section>

  <section class="status">
    <div class="card">
      <h2>💧 Nivel de Agua</h2>
      <p id="waterLevel">--%</p>
    </div>
    <div class="card">
      <h2>🌡️ Temperatura</h2>
      <p id="temperature">--°C</p>
    </div>
    <div class="card">
      <h2>🌿 Nutrientes</h2>
      <p id="nutrients">--%</p>
    </div>
    <div class="card">
      <h2>💡 Iluminación</h2>
      <p id="light">--%</p>
    </div>
    <div class="card">
      <h2>⚗️ pH</h2>
      <p id="ph">--</p>
    </div>
  </section>

  <footer>
    <p>EcoGrow © 2026 - Conectando la naturaleza con la tecnología</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
