<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoGrow - Torre Hidropónica</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>🌱 EcoGrow - Torre Hidropónica</h1>
    <p>Monitoreo visual de tu sistema inteligente</p>
  </header>

  <section class="gallery">
    <img src="assets/img/img1.jpeg" alt="Torre con plantas" />
    <img src="assets/img/img2.jpeg" alt="Estructura sin plantas" />
    <img src="assets/img/img3.jpeg" alt="Torre con lechugas" />
  </section>

  <section class="status">
    <div class="card">
      <h2>💧 Nivel de Agua</h2>
      <p id="waterLevel">--%</p>
    </div>
    <div class="card">
      <h2>🌡️ Temperatura</h2>
      <p id="temperature">--°C</p>
    </div>
    <div class="card">
      <h2>🌿 Nutrientes</h2>
      <p id="nutrients">--%</p>
    </div>
    <div class="card">
      <h2>💡 Iluminación</h2>
      <p id="light">--%</p>
    </div>
    <div class="card">
      <h2>⚗️ pH</h2>
      <p id="ph">--</p>
    </div>
  </section>

  <!-- NUEVO: Formulario con validaciones dinámicas -->
  <section class="form-section">
    <h2>Formulario de Registro</h2>
    <form id="registroForm">
      <label>
        Nombre:
        <input type="text" id="nombre" required />
        <span class="error" id="error-nombre"></span>
      </label>

      <label>
        Correo electrónico:
        <input type="email" id="correo" required />
        <span class="error" id="error-correo"></span>
      </label>

      <label>
        Contraseña:
        <input type="password" id="password" required />
        <span class="error" id="error-password"></span>
      </label>

      <label>
        Confirmar Contraseña:
        <input type="password" id="confirmPassword" required />
        <span class="error" id="error-confirm"></span>
      </label>

      <label>
        Edad:
        <input type="number" id="edad" required />
        <span class="error" id="error-edad"></span>
      </label>

      <div class="form-buttons">
        <button type="submit" id="submitBtn" disabled>Enviar</button>
        <button type="reset">Reiniciar</button>
      </div>
    </form>
  </section>

  <footer>
    <p>EcoGrow © 2026 - Conectando la naturaleza con la tecnología</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
